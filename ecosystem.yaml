# ecosystem.yaml — Kanidm Realm
#
# Realm for tracking kanidm/kanidm — "a simple, secure and fast identity
# management platform" (https://github.com/kanidm/kanidm, upstream default
# branch: master). Not part of the SiliconSaga game-hosting stack; this
# realm just clones/builds/tests the project, it isn't chart-deployed here.
#
# Forked from SiliconSaga/realm-template.

defaults:
  gitOrg: https://github.com/kanidm

identity:
  agent_account: agent-kanidm
  # co_authored_by is intentionally unset — when omitted, ws-commit.sh falls
  # back to "Claude ${CLAUDE_MODEL:-Opus 4.7}", so the trailer tracks
  # whichever model is actually running instead of aging as a stale pin.
  #
  # human_account is personal — set it in ecosystem.local.yaml, not here

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------

components:
  # kanidm — upstream tracks `master`. No chart/namespace: standalone Rust
  # project (Cargo workspace), not a Helm-deployed component in this realm.
  # forkRepo points at the existing soloturn fork.
  kanidm:
    tier: supporting
    repo: https://github.com/kanidm/kanidm.git
    forkRepo: https://github.com/soloturn/kanidm.git
