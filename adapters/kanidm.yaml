# kanidm adapter — build/test/lint/run commands, verified against the
# project's own developer docs (https://kanidm.github.io/kanidm/master/developers/index.html)
# rather than guessed from the Cargo-workspace convention alone.
#
# Prerequisites (system deps vary by OS - see the developer docs):
#   macOS: Xcode + rustup (https://rustup.rs/)
#   Debian/Ubuntu: libudev-dev libssl-dev libsystemd-dev pkg-config libpam0g-dev clang lld

commands:
  build: "cargo build"
  test: "cargo test"          # must work without extra setup
  # CI's "Linting checks" workflow is two jobs — clippy AND rustfmt — so lint
  # has to run both or it reports a green that CI contradicts. A wrapper
  # because the adapter execs a bare argv with no shell.
  lint: "../../realms/realm-kanidm/scripts/lint.sh"
  fmt: "cargo fmt"            # writes; the --check form is part of lint above
  run: "./scripts/run_insecure_dev_server.sh"
  clean: "cargo clean"

ai_context:
  - path: "README.md"
    description: "Project overview and links to developer/user docs"
  - path: "book/src/developers/readme.md"
    description: "Full developer guide: build/test/lint, running a local dev server, doc build"
